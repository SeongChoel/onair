[package]
name = "web"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
ui = { workspace = true }
api = { workspace = true }
serde_json = "1"

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server", "ui/server", "api/server"]
